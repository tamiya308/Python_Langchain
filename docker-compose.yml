services:
  qdrant:
    image: qdrant/qdrant:v1.19.1  # match qdrant-client in requirements.txt
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env  # OPENAI_API_KEY
    environment:
      # overrides the localhost value in .env: inside compose, Qdrant is reached by service name
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      # /import reads these by default ("./Drill Logs", "./Drill Images" relative to /app)
      - "./Drill Logs:/app/Drill Logs:ro"
      - "./Drill Images:/app/Drill Images:ro"
    depends_on:
      - qdrant

volumes:
  qdrant_data:
